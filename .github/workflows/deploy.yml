name: Deploy Shopverse to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Shopverse
        run: npm run build

      - name: Check generated website
        run: |
          test -f dist/client/index.html
          echo "index.html found"
          find dist/client -maxdepth 2 -type f | head -30

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Shopverse
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

      - name: Deploy Shopverse
        id: deployment
        uses: actions/deploy-pages@v4